<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BLITZ RELOADED</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #05060a; color: #e6e6ea;
    overflow: hidden; width: 100%; height: 100%;
    font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif;
  }
  #stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    transform-origin: 0 0;
    background: #05060a;
  }
  /* Layer 1: the three.js world. Layer 2: the fixed 1920x1080 Canvas2D overlay. */
  #gl, #ui {
    position: absolute; left: 0; top: 0; display: block;
    width: 100%; height: 100%;
  }
  #gl { z-index: 1; }
  #ui { z-index: 2; pointer-events: none; }
  #fatal {
    display: none; position: absolute; z-index: 99; left: 0; top: 0; right: 0;
    padding: 24px; background: #1a0000; color: #ff8080;
    font: 14px/1.5 "DejaVu Sans Mono", monospace; white-space: pre-wrap;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ui"></canvas>
    <pre id="fatal"></pre>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
