<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="cv" width="1920" height="1080"></canvas>
<script type="module">
import { createFaces } from '/src/pieces/typeface-lettering/render.js';
import { SPECIMENS } from '/src/pieces/typeface-lettering/specimen.js';
const q = new URLSearchParams(location.search);
const scene = q.get('scene') || 'iso_type';
const c = document.getElementById('cv').getContext('2d');
const faces = createFaces();
const ui = { W:1920, H:1080, faces, brand:null, safe:{l:48,t:36,r:48,b:36},
  seed: +(q.get('seed')||7), t: +(q.get('t')||0), quality:'capture', px:(n)=>n, shot:{id:scene} };
c.clearRect(0,0,1920,1080);
try { SPECIMENS[scene](c, ui.t, {}, ui); window.__OK__ = true; }
catch(e){ window.__ERR__ = String(e && e.stack || e); console.error(e); }
</script></body></html>
